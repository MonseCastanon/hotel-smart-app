name: hotel_smart_app
description: "Smart TV dashboard para gestión hotelera en tiempo real."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Navegación declarativa (mismo paquete que hotel_app)
  go_router: ^14.8.1

  # Firebase - misma base de datos que hotel_app y hotel_wear_app
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.9

  # State management - alineado con Hotel-Project y hotel_wear_app
  flutter_riverpod: ^2.6.1

  # Fuentes
  google_fonts: ^6.3.1
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
